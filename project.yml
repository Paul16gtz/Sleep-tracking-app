name: SleepTracker
options:
  bundleIdPrefix: com.paul
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  SleepTracker:
    type: application
    platform: iOS
    sources:
      - path: SleepTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paul.sleeptracker
        INFOPLIST_FILE: SleepTracker/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  SleepTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SleepTrackerTests
    dependencies:
      - target: SleepTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paul.sleeptracker.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SleepTracker:
    build:
      targets:
        SleepTracker: all
        SleepTrackerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SleepTrackerTests
